---
name: Release
# A release needs both main workflows green for the commit it releases:
# "Go Lint, Test & Build" and "Build, Push & Scan Container Image". Each of
# them triggers this workflow when it completes; the gate checks the other
# one, so the second to finish releases. The gate also skips a commit that
# is no longer main's head (its successor's runs release it), because the
# release itself checks out main's head.
on:
  workflow_run:
    workflows:
      - "Go Lint, Test & Build"
      - "Build, Push & Scan Container Image"
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    name: Tests and image green
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check both workflows for the commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual run: no gate."
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head=$(gh api "repos/$REPO/commits/main" -q .sha)
          if [ "$head" != "$SHA" ]; then
            echo "$SHA is no longer main's head ($head); its successor releases."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ready=true
          for wf in golang-validation.yaml build-scan-image.yaml; do
            state=$(gh api "repos/$REPO/actions/workflows/$wf/runs?head_sha=$SHA&event=push&per_page=1" \
              -q '.workflow_runs[0] | if . == null then "missing" elif .status != "completed" then .status else .conclusion end')
            echo "$wf: $state"
            [ "$state" = "success" ] || ready=false
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

  release:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-go-release.yaml@main
    with:
      runs-on: ubuntu-latest
      stage-image: true
    secrets: inherit
